# Dataset presets for virtualize.py. Each top-level key is a preset name (the
# script's first argument); its fields map onto the Dataset dataclass:
#
#   bucket_url         bucket used for anonymous listing, e.g. s3://bucket
#   http_base          public HTTPS base embedded in the references; ends in "/"
#   key_root           dataset prefix inside the bucket; ends in "/"
#   key_template       per-day folder under key_root (strftime format)
#   file_regex         which file names in a day folder belong to this stream
#   concat_dim         dimension the files are appended along
#   loadable           (optional) small variables to materialize; must include concat_dim
#   time_chunk         (optional, default 4096) chunk length of the concat coordinate
#   folder_margin_days (optional, default 1) day folders listed beyond each end
#                      of --start/--end, which select by valid time; needed
#                      when a folder holds data of neighbouring days
#   drop_global_attrs  (optional, default [file, history]) list of global
#                      attribute names that describe a single run/file;
#                      shell-style wildcards allowed, e.g. frc_file_*
#   coord_aliases      (optional, default none) {alias: source} extra coordinates
#                      that reuse another coordinate's references, e.g. a plain
#                      lat/lon for viewers that only look for those names
#
#   Source reads (all optional; used when building overviews and validating,
#   never saved in the repository; --source-* flags override them):
#   source_concurrency      (default 32) concurrent HTTP requests to the source
#   source_connect_timeout  (default 30) seconds per TCP/TLS connect
#   source_timeout          (default 300) seconds per request
#   source_http_retries     (default 10) tries per chunk request, incl. the first
#   source_read_retries     (default 5) retries of a whole failed read (30 s, 60 s, ...)
#   e.g. for a slow or NAT-limited network:  source_concurrency: 8
#
# Quote regexes with single quotes so backslashes are kept as-is. Quote list
# entries that start with * or [ (YAML gives those a meaning), and any pattern
# with [...] inside an inline [a, b] list.

# WCOFS (West Coast Operational Forecast System), NOAA NOS, on the NOAA Open
# Data Dissemination bucket. One cycle (t03z) per day. The nowcast files of
# day D cover D-1 06:00 .. D 03:00 at 3-hourly steps, so consecutive days are
# contiguous and never overlap. Forecast files (fNNN) overlap across days and
# are deliberately NOT a preset: they need a run/lead-time dimension.
wcofs-fields-nowcast:
  bucket_url: s3://noaa-nos-ofs-pds
  http_base: https://noaa-nos-ofs-pds.s3.amazonaws.com/
  key_root: wcofs/netcdf/
  key_template: "%Y/%m/%d/"
  file_regex: '^wcofs\.t\d{2}z\.\d{8}\.fields\.n\d{3}\.nc$'
  concat_dim: ocean_time
  loadable: [ocean_time]
  # ROMS has four staggered grids (rho, u, v, psi). Plain lat/lon point at the
  # rho grid, where most fields (temp, salt, zeta, ...) live.
  coord_aliases: {lat: lat_rho, lon: lon_rho}
  drop_global_attrs:
    - file
    - history
    - rst_file
    - his_base
    - sta_file
    - ini_file
    - river_file
    - 'frc_file_[0-9]*'
    - 'bry_file_[0-9]*'
    - 'clm_file_[0-9]*'

# CIOFS (Cook Inlet Operational Forecast System, ROMS), NOAA NOS, on the same
# NODD bucket. Four cycles (t00z/06z/12z/18z) per day, each with six hourly
# nowcast files (n001..n006) covering the 6 hours up to the cycle time, so
# consecutive cycles and days are contiguous. The %Y/%m/%d/ layout starts on
# 2024-11-19; older files sit in flat YYYYMM/ folders this preset does not read.
# Forecast files (fNNN) overlap across cycles and are not a preset, as for WCOFS.
ciofs-fields-nowcast:
  bucket_url: s3://noaa-nos-ofs-pds
  http_base: https://noaa-nos-ofs-pds.s3.amazonaws.com/
  key_root: ciofs/netcdf/
  key_template: "%Y/%m/%d/"
  file_regex: '^ciofs\.t\d{2}z\.\d{8}\.fields\.n\d{3}\.nc$'
  concat_dim: ocean_time
  loadable: [ocean_time]
  coord_aliases: {lat: lat_rho, lon: lon_rho}
  drop_global_attrs:
    - file
    - history
    - rst_file
    - his_base
    - sta_file
    - ini_file
    - river_file
    - 'frc_file_[0-9]*'
    - 'bry_file_[0-9]*'
    - 'clm_file_[0-9]*'

# The same model runs, interpolated by NOAA onto a regular lat/lon grid
# ("regulargrid" files: WCOFS 0.04 deg, 935x833; CIOFS 0.005 deg, 973x1461) at
# fixed depths (Depth, metres) with currents already rotated to east/north
# (u_eastward, v_northward). Because the grid is regular, these stores can carry
# multiscale overviews for web maps (see README, "Multiscale overviews").
# Latitude/Longitude are 2-D in the files; `rectilinear` turns them into 1-D
# lat/lon coordinates. Depth is materialized so viewers needn't fetch it from NOAA.
wcofs-regulargrid-nowcast:
  bucket_url: s3://noaa-nos-ofs-pds
  http_base: https://noaa-nos-ofs-pds.s3.amazonaws.com/
  key_root: wcofs/netcdf/
  key_template: "%Y/%m/%d/"
  file_regex: '^wcofs\.t\d{2}z\.\d{8}\.regulargrid\.n\d{3}\.nc$'
  concat_dim: time
  loadable: [time, Depth, Latitude, Longitude]
  rectilinear: {lat: Latitude, lon: Longitude}
  drop_global_attrs: &ofs_run_attrs
    - file
    - history
    - rst_file
    - his_base
    - sta_file
    - ini_file
    - avg_file
    - grd_file
    - river_file
    - 'frc_file_[0-9]*'
    - 'bry_file_[0-9]*'
    - 'clm_file_[0-9]*'
  # Overview data is real data: per time step about a third of each variable's
  # full size (WCOFS 3-D variable: ~128 MB raw per step, so ~43 MB of overviews;
  # a month of all five is ~40 GB before compression), and building it reads the
  # variables in full from NOAA. Trim `variables` to what you will map.
  overviews:
    variables: [zeta, temp, salt, u_eastward, v_northward]
    levels: 3
    method: mean

ciofs-regulargrid-nowcast:
  bucket_url: s3://noaa-nos-ofs-pds
  http_base: https://noaa-nos-ofs-pds.s3.amazonaws.com/
  key_root: ciofs/netcdf/
  key_template: "%Y/%m/%d/"
  file_regex: '^ciofs\.t\d{2}z\.\d{8}\.regulargrid\.n\d{3}\.nc$'
  concat_dim: time
  loadable: [time, Depth, Latitude, Longitude]
  rectilinear: {lat: Latitude, lon: Longitude}
  drop_global_attrs: *ofs_run_attrs
  overviews:
    variables: [zeta, temp, salt, u_eastward, v_northward]
    levels: 3
    method: mean
